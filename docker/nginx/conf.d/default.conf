server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml image/png image/jpeg;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Redirect rewrite: grails uses localhost:8080 internally
    proxy_redirect http://localhost:8080/ http://10.50.0.9:9092/;
    proxy_redirect http://localhost/ http://10.50.0.9:9092/;

    location /openboxes/assets/ {
        proxy_pass http://app:8080;
        proxy_cache_valid 200 1h;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://app:8080;
        proxy_read_timeout 90s;
        proxy_buffering on;
        proxy_cache_valid 200 5m;
    }
}
