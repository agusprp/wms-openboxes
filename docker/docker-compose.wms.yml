# OpenBoxes WMS — connect to existing mariadb-service (mariadb-net)
# Port: nginx=9092 → Grails app=8080 internal

services:
  app:
    image: wms-openboxes:custom
    container_name: openboxes-wms-app
    expose:
      - "8080"
    environment:
      DATASOURCE_USERNAME: openboxes
      DATASOURCE_PASSWORD: openboxes
      DATASOURCE_URL: jdbc:mysql://mariadb-service:3306/openboxes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta
      GRAILS_SERVER_URL: http://10.50.0.9:9092/openboxes
      SERVER_URL: http://10.50.0.9:9092/openboxes
      JAVA_TOOL_OPTIONS: -Xms1024m -Xmx1536m -XX:+UseParallelGC -Djava.awt.headless=true
    networks:
      - wms-net
    healthcheck:
      test: "curl --fail --silent localhost:8080/openboxes/health | grep UP || exit 1"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: openboxes-wms-nginx
    ports:
      - "9092:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - wms-net
    restart: unless-stopped

networks:
  wms-net:
    name: mariadb-net
    external: true
